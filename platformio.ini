; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200

; Tabla de particiones con doble app (OTA + rollback), SPIFFS y coredump.
; 8 MB (módulo N8) para dar margen a la plataforma configurable V8. Alternativas:
;   partitions/default.csv       (4 MB — DevKit/WROOM, ajustado)
;   partitions/default_16MB.csv  (16 MB)
board_build.partitions = partitions/default_8MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -Wno-unused-variable
    -Wno-unused-function

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit AHTX0@^2.0.4
    adafruit/Adafruit ADS1X15@^2.4.1
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.6.1

