; PlatformIO Project Configuration File
;
; Multi-board: un único código fuente para ESP32 / S2 / S3 / C3 / C6 (y C5 cuando
; el core lo exponga). `pio run` compila el entorno por defecto; para otro target:
;   pio run -e esp32-s3-devkitc-1
;
; NOTA de flash: el firmware completo (~1,25 MB) solo entra en particiones de 8 MB
; o 16 MB. Los boards de 4 MB (S2/C3 devkit) requieren recortar funciones o usar
; un módulo N8/N16.

[platformio]
default_envs = esp32doit-devkit-v1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -Wno-unused-variable
    -Wno-unused-function

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit AHTX0@^2.0.4
    adafruit/Adafruit ADS1X15@^2.4.1
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.6.1
    arduino-libraries/Ethernet@^2.0.0

; --- ESP32 clásico (DevKit/WROOM, N8) ---
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
board_build.partitions = partitions/default_8MB.csv

; --- ESP32-S3 (N8/N16) ---
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.partitions = partitions/default_8MB.csv

; --- ESP32-S2 (4 MB) ---
[env:esp32-s2-saola-1]
board = esp32-s2-saola-1
board_build.partitions = partitions/default.csv

; --- ESP32-C3 (4 MB) ---
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
board_build.partitions = partitions/default.csv

; --- ESP32-C6 (N8) ---
[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1
board_build.partitions = partitions/default_8MB.csv
