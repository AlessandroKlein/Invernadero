# Servidor central de la plataforma Invernadero.
# Servicios: PostgreSQL + Mosquitto (MQTT) + PHP/Apache + Adminer.
# Levantar con:  docker compose up -d --build
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: invernadero-db
    environment:
      POSTGRES_USER: ${DB_USER:-invernadero}
      POSTGRES_PASSWORD: ${DB_PASS:-invernadero}
      POSTGRES_DB: ${DB_NAME:-invernadero}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-invernadero}"]
      interval: 5s
      timeout: 3s
      retries: 12

  mqtt:
    image: eclipse-mosquitto:2
    container_name: invernadero-mqtt
    ports:
      - "1883:1883"   # MQTT (dispositivos)
      - "9001:9001"   # MQTT over WebSocket (dashboard)
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
      - mqttlog:/mosquitto/log

  php:
    build: .
    container_name: invernadero-php
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-invernadero}
      DB_USER: ${DB_USER:-invernadero}
      DB_PASS: ${DB_PASS:-invernadero}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_WS_PORT: "9001"
      JWT_SECRET: ${JWT_SECRET:-cambiar-esta-clave}
    volumes:
      - .:/var/www/html

  adminer:
    image: adminer:4
    container_name: invernadero-adminer
    depends_on:
      - db
    ports:
      - "8081:8080"

  # Exposición pública opcional mediante túnel de Cloudflare.
  # Requiere TUNNEL_TOKEN en .env. Levantar con:
  #   docker compose --profile tunnel up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: invernadero-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - php
    restart: unless-stopped

volumes:
  pgdata:
  mqttdata:
  mqttlog:
